<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上下班路況</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#1a73e8; --border:#e3e5e8; --onaccent:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e8eaed; --muted:#9aa0a6; --accent:#8ab4f8; --border:#2c3038; --onaccent:#111317; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  main { max-width:480px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 4px; } h2 { font-size:1.05rem; margin:0 0 8px; } h3 { font-size:.95rem; margin:14px 0 6px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .btn { display:block; text-align:center; text-decoration:none; padding:18px; border-radius:12px; font-size:1.15rem;
         font-weight:600; margin-bottom:10px; border:2px solid var(--accent); color:var(--accent); background:transparent; }
  .btn.primary { background:var(--accent); color:var(--onaccent); }
  .links a { display:block; padding:10px 0; color:var(--accent); text-decoration:none; border-bottom:1px solid var(--border); }
  .links a:last-child { border-bottom:0; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:10px; font-size:1rem; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  input[type=checkbox] { width:auto; margin-right:6px; }
  button { margin-top:12px; width:100%; padding:12px; font-size:1rem; border-radius:8px; border:0; background:var(--accent); color:var(--onaccent); cursor:pointer; }
  .tip, .hint { font-size:.82rem; color:var(--muted); line-height:1.5; }
  .tip { margin:0 2px 14px; } .hint { margin-top:8px; }
  .sec { display:flex; justify-content:space-between; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); font-size:.92rem; }
  .sec:last-child { border-bottom:0; } .sec span:last-child { white-space:nowrap; color:var(--muted); }
  .sum { padding:10px; border-radius:10px; background:var(--bg); line-height:1.5; }
  .warn { color:#d93025; font-size:.85rem; margin:6px 0; white-space:pre-wrap; }
  details summary { cursor:pointer; color:var(--accent); font-size:.9rem; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>🚦 上下班路況</h1>
  <div class="sub" id="now"></div>

  <div id="buttons"></div>
  <div class="tip">開啟後 Google 地圖會顯示即時路況、預估時間與備選路線。</div>

  <div class="card">
    <h2>🛣 國道路況(高公局資料)</h2>
    <div id="fwMeta" class="hint" style="margin:0 0 6px"></div>
    <div id="fw">載入中…</div>
    <button id="fwReload">重新載入</button>
    <div class="hint">資料由 GitHub Actions 在通勤時段每約 10 分鐘更新一次,可能延遲數分鐘。需要立即更新請到
      <a id="runLink" target="_blank" rel="noopener" style="color:var(--accent)">Actions 手動執行</a>。</div>
  </div>

  <div class="card links">
    <a href="https://www.google.com/maps/@?api=1&map_action=map&layer=traffic" target="_blank" rel="noopener">🗺 Google 地圖:即時路況圖層</a>
    <a href="https://1968.freeway.gov.tw/" target="_blank" rel="noopener">🛣 1968 國道即時路況</a>
  </div>

  <details class="card" id="settings">
    <summary>⚙️ 設定</summary>
    <label>家</label><input id="home" placeholder="例:台中車站">
    <label>公司</label><input id="work" placeholder="例:台中市政府">
    <label>交通方式</label>
    <select id="mode"><option value="driving">開車</option><option value="two-wheeler">機車</option>
      <option value="transit">大眾運輸</option><option value="walking">步行</option></select>
    <label><input type="checkbox" id="noToll">避開收費道路 / 高速公路</label>
    <button id="save">儲存</button>
    <div class="hint">設定只存在你自己的瀏覽器(localStorage),不會上傳到 GitHub。國道要監看的路段,請編輯 repo 裡的 route.json。</div>
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const q = new URLSearchParams(location.search);
const cfg = {
  home: q.get("home") || store.get("home"), work: q.get("work") || store.get("work"),
  mode: q.get("mode") || store.get("mode", "driving"), noToll: store.get("noToll") === "1",
};

function dirUrl(o, d) {
  let u = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(o) +
          "&destination=" + encodeURIComponent(d) + "&travelmode=" + cfg.mode;
  if (cfg.noToll && cfg.mode === "driving") u += "&avoid=tolls,highways";
  return u;
}

function render() {
  const d = new Date();
  $("now").textContent = d.toLocaleString("zh-TW", { month:"numeric", day:"numeric", weekday:"short", hour:"2-digit", minute:"2-digit" }) + " · v3.1";
  const morning = d.getHours() < 12, box = $("buttons"); box.innerHTML = "";
  if (!cfg.home || !cfg.work) {
    box.innerHTML = '<div class="card">請先展開下方「設定」填入家和公司。</div>';
    $("settings").open = true;
  } else {
    const mk = (t, h, p) => Object.assign(document.createElement("a"), { className: "btn" + (p ? " primary" : ""), textContent: t, href: h, target: "_blank", rel: "noopener" });
    const a = mk("🚗 上班路況(家 → 公司)", dirUrl(cfg.home, cfg.work), morning);
    const b = mk("🏠 下班路況(公司 → 家)", dirUrl(cfg.work, cfg.home), !morning);
    box.append(...(morning ? [a, b] : [b, a]));
  }
  $("home").value = cfg.home; $("work").value = cfg.work; $("mode").value = cfg.mode; $("noToll").checked = cfg.noToll;
}
$("save").onclick = () => {
  cfg.home = $("home").value.trim(); cfg.work = $("work").value.trim(); cfg.mode = $("mode").value; cfg.noToll = $("noToll").checked;
  store.set("home", cfg.home); store.set("work", cfg.work); store.set("mode", cfg.mode); store.set("noToll", cfg.noToll ? "1" : "0");
  render();
};

/* ---- 國道路況 ---- */
const lvl = s => s >= 250 ? "⛔ 封閉" : s <= 0 ? "❔ 無資料" : s < 40 ? "🔴 嚴重壅塞" : s < 60 ? "🟠 壅塞" : s < 80 ? "🟡 車多" : "🟢 順暢";
const row = s => `<div class="sec"><span>${esc(s.name)}</span><span>${lvl(s.speed)}${s.speed > 0 && s.speed < 250 ? " · " + Math.round(s.speed) + " km/h" : ""}</span></div>`;

async function loadFreeway() {
  $("fw").textContent = "載入中…"; $("fwMeta").textContent = "";
  try {
    const r = await fetch("data/traffic.json?t=" + Date.now());
    if (!r.ok) throw new Error("讀不到 data/traffic.json");
    const j = await r.json();
    if (j.updated) {
      const age = Math.round((Date.now() - Date.parse(j.updated)) / 60000);
      $("fwMeta").textContent = "資料更新:" + new Date(j.updated).toLocaleString("zh-TW", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" }) + `(${age} 分鐘前)`;
      if (age > 30) $("fwMeta").textContent += " ⚠️ 資料較舊,非通勤時段不會自動更新";
    }
    let html = j.error ? `<div class="warn">⚠️ ${esc(j.error)}</div>` : "";
    const hour = new Date().getHours();
    const routes = (j.routes || []).slice().sort((a, b) => (a.name.startsWith(hour < 12 ? "上班" : "下班") ? -1 : 1) - (b.name.startsWith(hour < 12 ? "上班" : "下班") ? -1 : 1));
    for (const rt of routes) {
      const bad = rt.sections.filter(s => s.speed > 0 && s.speed < 60 || s.speed >= 250).sort((a, b) => a.speed - b.speed);
      html += `<h3>${esc(rt.name)}・${esc(rt.road)}</h3>`;
      if (rt.hint) { html += `<div class="warn">${esc(rt.hint)}</div>`; continue; }
      html += `<div class="sum">${bad.length ? `⚠️ 目前有 <b>${bad.length}</b> 個路段車速偏低` : "✅ 你的路段目前沒有壅塞"}(共監看 ${rt.sections.length} 段)</div>`;
      if (bad.length) html += bad.map(row).join("");
      html += `<details><summary>查看全部 ${rt.sections.length} 個路段</summary>${rt.sections.map(row).join("")}</details>`;
    }
    $("fw").innerHTML = html || '<div class="hint">尚無資料</div>';
  } catch (e) { $("fw").innerHTML = `<div class="warn">⚠️ ${esc(e.message)}\n請先到 GitHub Actions 手動執行一次 Freeway Traffic。</div>`; }
}
$("fwReload").onclick = loadFreeway;
{
  const m = location.hostname.match(/^(.+)\.github\.io$/), repo = location.pathname.split("/")[1];
  $("runLink").href = m && repo ? `https://github.com/${m[1]}/${repo}/actions/workflows/freeway.yml` : "#";
}
render(); loadFreeway();
</script>
</body>
</html>
