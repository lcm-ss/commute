name: Freeway Traffic

on:
  schedule:
    # cron 為 UTC(台灣 = UTC+8)。僅在通勤時段每 10 分鐘更新一次
    - cron: "*/10 23 * * 0-4"   # 台灣週一~五 07:00-07:59
    - cron: "*/10 0 * * 1-5"    # 台灣週一~五 08:00-08:59
    - cron: "*/10 9,10 * * 1-5" # 台灣週一~五 17:00-18:59
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_freeway.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/traffic.json
          git diff --cached --quiet || (git commit -m "update freeway traffic" && git push)
